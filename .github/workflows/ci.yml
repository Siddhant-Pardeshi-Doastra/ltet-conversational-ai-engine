# CI: lint + full test suite with synthetic fixtures only (no paid keys, no real data).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run lint
      - name: Tests (engine, conversation, security, post-call, API, live-mode)
        run: npm test
      - name: Seed reproducibility check
        run: node server/seed.js --force

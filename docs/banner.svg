<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="LTET Conversational AI Engine banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="55%" stop-color="#0d2f4a"/>
      <stop offset="100%" stop-color="#0b4f4b"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="24s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fe0d6">
        <animate attributeName="stop-color" values="#7fe0d6;#eaf2f8;#7fe0d6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#eaf2f8">
        <animate attributeName="stop-color" values="#eaf2f8;#6fd6cc;#eaf2f8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f0cd7e">
        <animate attributeName="stop-color" values="#f0cd7e;#7fe0d6;#f0cd7e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fbf9f"/>
      <stop offset="100%" stop-color="#4fb3a5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="none" stroke="#2fbf9f" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- ambient glow blobs -->
  <circle cx="1050" cy="60" r="90" fill="#2fbf9f" opacity="0.12" filter="url(#soft)">
    <animate attributeName="r" values="80;105;80" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="250" r="110" fill="#1d5f95" opacity="0.14" filter="url(#soft)">
    <animate attributeName="r" values="100;125;100" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- phone glyph -->
  <g transform="translate(72,86)">
    <rect x="0" y="0" width="88" height="128" rx="14" fill="#0a2236" stroke="#2fbf9f" stroke-opacity="0.7" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="44" cy="104" r="7" fill="#2fbf9f">
      <animate attributeName="fill" values="#2fbf9f;#f0cd7e;#2fbf9f" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- equalizer bars inside the phone -->
    <g fill="url(#wave)">
      <rect x="16" y="52" width="7" height="18" rx="3">
        <animate attributeName="height" values="10;26;8;20;10" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="56;42;60;50;56" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="29" y="46" width="7" height="26" rx="3">
        <animate attributeName="height" values="22;10;30;14;22" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="48;58;40;55;48" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="42" y="40" width="7" height="32" rx="3">
        <animate attributeName="height" values="30;16;34;20;30" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="44;56;38;50;44" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="55" y="46" width="7" height="26" rx="3">
        <animate attributeName="height" values="14;28;12;24;14" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="56;44;58;48;56" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="68" y="52" width="7" height="18" rx="3">
        <animate attributeName="height" values="24;10;22;16;24" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="46;58;46;52;46" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- traveling signal dot from mic upward -->
    <circle cx="44" cy="26" r="3.5" fill="#f0cd7e">
      <animate attributeName="cy" values="30;8;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title block -->
  <g transform="translate(196,0)">
    <text x="0" y="118" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)">LTET Conversational AI Engine</text>
    <text x="2" y="152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a8c4d8">Dial. Verify. Answer — fact-safe, in 22 languages, with an auditable trail.</text>
    <text x="2" y="182" font-family="Consolas, monospace" font-size="15" fill="#7fe0d6">PS number → full name → date of birth → verified answer</text>
    <!-- animated verification ticks -->
    <g font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700">
      <g>
        <rect x="2" y="200" width="150" height="30" rx="15" fill="#2fbf9f" fill-opacity="0.16" stroke="#2fbf9f" stroke-opacity="0.55"/>
        <text x="16" y="220" fill="#7fe0d6">✓ fact-checked</text>
        <animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="162" y="200" width="140" height="30" rx="15" fill="#f0cd7e" fill-opacity="0.14" stroke="#f0cd7e" stroke-opacity="0.5"/>
        <text x="178" y="220" fill="#f0cd7e">22 languages</text>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="312" y="200" width="128" height="30" rx="15" fill="#7c8fd6" fill-opacity="0.14" stroke="#7c8fd6" stroke-opacity="0.5"/>
        <text x="328" y="220" fill="#b9c6f2">auditable</text>
        <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- right-side: the four-step flow, highlighted in rotation -->
  <g transform="translate(880,70)" font-family="Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">
    <g>
      <rect x="0" y="0" width="270" height="34" rx="17" fill="#2fbf9f" fill-opacity="0.13" stroke="#2fbf9f" stroke-opacity="0.6"/>
      <text x="18" y="22" fill="#7fe0d6">1 · ☎ Dial the helpline</text>
      <animate attributeName="fill-opacity" values="0.30;0.13;0.13;0.13;0.30" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0.4;0.4;0.4;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(0,44)">
      <rect x="0" y="0" width="270" height="34" rx="17" fill="#2fbf9f" fill-opacity="0.13" stroke="#2fbf9f" stroke-opacity="0.4"/>
      <text x="18" y="22" fill="#c9e8e2">2 · 🔢 PS number — read back</text>
      <animate attributeName="fill-opacity" values="0.13;0.30;0.13;0.13;0.13" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;1;0.4;0.4;0.4" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(0,88)">
      <rect x="0" y="0" width="270" height="34" rx="17" fill="#2fbf9f" fill-opacity="0.13" stroke="#2fbf9f" stroke-opacity="0.4"/>
      <text x="18" y="22" fill="#c9e8e2">3 · 🗣 Name + date of birth</text>
      <animate attributeName="fill-opacity" values="0.13;0.13;0.30;0.13;0.13" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0.4;1;0.4;0.4" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(0,132)">
      <rect x="0" y="0" width="270" height="34" rx="17" fill="#2fbf9f" fill-opacity="0.13" stroke="#2fbf9f" stroke-opacity="0.4"/>
      <text x="18" y="22" fill="#c9e8e2">4 · ✅ Verified answer — live data</text>
      <animate attributeName="fill-opacity" values="0.13;0.13;0.13;0.30;0.13" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0.4;0.4;1;0.4" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
